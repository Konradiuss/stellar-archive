# Only changes outside public/ run it: the editor publishes content alone, and the tests pin the demo map.
name: Tests

on:
  push:
    branches: [main]
    paths-ignore: ['public/**']
  pull_request:
    paths-ignore: ['public/**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
